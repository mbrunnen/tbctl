[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tbctl"
dynamic = ["version"]
description = "CLI for ThingsBoard OTA package management"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Manoel Brunnen" }]
keywords = ["thingsboard", "ota", "cli", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "python-dateutil>=2.8",
    "urllib3>=2",
    "tomli-w>=1.0",
    "plotext>=5",
]

[project.urls]
Homepage = "https://github.com/mbrunnen/tbctl"
Repository = "https://github.com/mbrunnen/tbctl"
Issues = "https://github.com/mbrunnen/tbctl/issues"

[project.scripts]
tbctl = "tbctl.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["tbctl", "generated/tb_client"]

[tool.hatch.build.targets.sdist]
include = ["/tbctl", "/generated/tb_client", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3",
    "python-lsp-server>=1.12",
    "python-lsp-ruff>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["tb_client", "tbctl"]
